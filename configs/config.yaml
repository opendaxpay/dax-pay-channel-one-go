# dax-pay-channel-one-go 配置（对标 Boot application.yml）
server:
  port: 20100

tracing:
  # 全采样，便于本地排障（对标 management.tracing.sampling.probability: 1.0）
  sample_ratio: 1.0
  # 默认不导出 OTLP（对标 otlp.enabled: false），仅进程内 span + 日志关联
  otlp_enabled: false

# 主应用 ↔ 子应用 报文透明加密（AES-256-GCM，强制常开）
# key 须恰好 32 字节 UTF-8 字符；生产环境用环境变量 CHANNEL_TRANSPORT_KEY 覆盖，勿提交真实密钥
channel:
  transport-encrypt:
    key: 0123456789abcdef0123456789abcdef
